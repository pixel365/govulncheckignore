name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Go
        uses: actions/setup-go@7d2730e317c8366225b42fced34583b26440a9cc
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...
